function allDaily(){let rows=[];Object.keys(store.months).sort().forEach(k=>(store.months[k].daily||[]).forEach(x=>rows.push({...x,month:k})));return rows.sort((a,b)=>a.date.localeCompare(b.date));}
function dashboard(){let m=active(),c=calc(m), prev=Object.keys(store.months).sort().filter(x=>x<store.currentMonth).pop();let games=m.daily.filter(x=>x.type==='buyins').length;let abi=games?c.invest/games:0;let selected=window.dashRoom||'';let scope=window.dashScope||'month';let source=scope==='all'?allDaily():m.daily.map(x=>({...x,month:store.currentMonth}));if(selected)source=source.filter(x=>x.room===selected);let fc=source.reduce((z,x)=>{if(x.type==='buyins'||x.type==='rebuys')z.invest+=x.value;else if(x.type==='cashes')z.cash+=x.value;return z},{invest:0,cash:0});fc.result=fc.cash-fc.invest;fc.roi=fc.invest?fc.result/fc.invest*100:0;let fg=source.filter(x=>x.type==='buyins').length;let fabi=fg?fc.invest/fg:0;let best=Math.max(0,...source.filter(x=>x.type==='buyins'||x.type==='rebuys').map(x=>x.value));document.getElementById('content').innerHTML=`<div class="hero"><div class="hero-row"><div><div class="hero-kicker">Poker Bankroll • Central de performance</div><div class="hero-title">${scope==='all'?'Visão geral de todos os meses':'Resumo do seu mês'}</div><div class="hero-sub">Acompanhe bankroll, volume e rentabilidade em uma única tela.</div></div><div class="hero-actions"><select class="filter" onchange="dashScope=this.value;dashboard()"><option value="month" ${scope==='month'?'selected':''}>Mês atual</option><option value="all" ${scope==='all'?'selected':''}>Todos os meses</option></select><select class="filter" onchange="dashRoom=this.value;dashboard()"><option value="" ${!selected?'selected':''}>Todas as salas</option>${rooms.map(r=>`<option ${selected===r?'selected':''}>${r}</option>`).join('')}</select></div></div></div><div class="kpi-grid"><div class="kpi"><div class="ico">💰</div><div class="klabel">Bankroll atual</div><div class="kvalue">${money(endingBankroll(m))}</div><div class="ksub">saldo final calculado</div></div><div class="kpi"><div class="ico">📈</div><div class="klabel">Profit</div><div class="kvalue ${fc.result>=0?'positive':'negative'}">${money(fc.result)}</div><div class="ksub">${scope==='all'?'acumulado':'no mês'}</div></div><div class="kpi"><div class="ico">🎯</div><div class="klabel">ROI</div><div class="kvalue ${fc.roi>=0?'positive':'negative'}">${fc.roi.toFixed(2)}%</div><div class="ksub">retorno sobre investimento</div></div><div class="kpi"><div class="ico">🎲</div><div class="klabel">Games</div><div class="kvalue">${fg}</div><div class="ksub">buy-ins registrados</div></div><div class="kpi"><div class="ico">💵</div><div class="klabel">ABI</div><div class="kvalue">${money(fabi)}</div><div class="ksub">investimento médio/jogo</div></div><div class="kpi"><div class="ico">🔥</div><div class="klabel">Maior buy-in</div><div class="kvalue">${money(best)}</div><div class="ksub">entre os lançamentos filtrados</div></div></div><div class="section insight"><div class="panel"><h2>Performance por sala</h2>${roomSummary(scope==='all'?allMonthlyAggregate():m, selected)}</div><div class="panel"><h2>Resumo do período</h2><div class="mini"><span>Investido</span><b>${money(fc.invest)}</b></div><div class="mini"><span>Retorno</span><b>${money(fc.cash)}</b></div><div class="mini"><span>Resultado</span><b class="${fc.result>=0?'positive':'negative'}">${money(fc.result)}</b></div><div class="mini"><span>ROI</span><b>${fc.roi.toFixed(2)}%</b></div><div class="mini"><span>Bankroll inicial</span><b>${money(m.openingBankroll||0)}</b></div><div class="mini"><span>Status</span><b>${m.closed?'🔒 Fechado':'🟢 Aberto'}</b></div><button class="btn primary" onclick="resumoDia()">📅 Resumo do Dia</button></div></div><div class="section panel"><h2>Gráfico de lucro — estilo SharkScope</h2>${sharkChartFiltered(source)}</div><div class="section panel"><h2>Fechamento do mês</h2><p class="note">Ao fechar o mês, os dados ficam preservados. O próximo mês novo recebe automaticamente o bankroll final deste mês como bankroll inicial.</p><button class="btn ${m.closed?'':'primary'}" onclick="${m.closed?'reopenMonth()':'closeMonth()'}">${m.closed?'Reabrir mês':'🔒 Fechar mês'}</button>${prev?`<span class="tag" style="margin-left:8px">Mês anterior: ${monthLabel(prev)}</span>`:''}</div>`}
function allMonthlyAggregate(){return {daily:allDaily(),cash:[],openingBankroll:0,closed:false}}
function sharkChart(m){return sharkChartFiltered((m.daily||[]).map(x=>({...x,month:store.currentMonth})));}
function sharkChartFiltered(rows){
 let arr=(rows||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
 let pts=[],cum=0,games=0;
 arr.forEach(x=>{if(x.type==='buyins'||x.type==='rebuys'){cum-=x.value;games++;pts.push({date:x.date,value:cum,game:games,kind:'invest'});}else if(x.type==='cashes'){cum+=x.value;pts.push({date:x.date,value:cum,game:games,kind:'cash'});}});
 if(!pts.length)return '<div class="empty">Adicione buy-ins, rebuys e cashes para visualizar o gráfico.</div>';
 let vals=[0,...pts.map(p=>p.value)],min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1;}let pad=(max-min)*.12;min-=pad;max+=pad;
 const W=1000,H=360,L=62,R=18,T=24,B=42,iw=W-L-R,ih=H-T-B;
 const x=i=>L+(i/(Math.max(pts.length-1,1)))*iw, y=v=>T+(max-v)/(max-min)*ih;
 let path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p.value).toFixed(1)).join(' ');
 let area=path+' L '+x(pts.length-1).toFixed(1)+','+y(0).toFixed(1)+' L '+x(0).toFixed(1)+','+y(0).toFixed(1)+' Z';
 let ticks=5,grid='';for(let i=0;i<=ticks;i++){let v=min+(max-min)*i/ticks,yy=y(v);grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#263247" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="#94a3b8" font-size="11">${money(v)}</text>`}
 let zero=y(0), circles=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="3.5" fill="#22c55e"><title>Jogo ${p.game} • ${fmtDate(p.date)} • ${money(p.value)}</title></circle>`).join('');
 let first=pts[0],last=pts[pts.length-1];
 let best=Math.max(...pts.map(p=>p.value)),worst=Math.min(...pts.map(p=>p.value));
 return `<div class="shark"><div class="shark-head"><div><div class="shark-title">Lucro acumulado</div><div class="shark-sub">Evolução por lançamento, com linha de referência em US$ 0,00</div></div><div class="shark-stats"><div class="sstat">Jogos<b>${games}</b></div><div class="sstat">Final<b>${money(last.value)}</b></div><div class="sstat">Máximo<b>${money(best)}</b></div><div class="sstat">Mínimo<b>${money(worst)}</b></div></div></div><svg class="shark-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#22c55e" stop-opacity=".28"/><stop offset="100%" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>${grid}<line x1="${L}" y1="${zero}" x2="${W-R}" y2="${zero}" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/><path d="${area}" fill="url(#sg)" opacity=".7"/><path d="${path}" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${circles}<text x="${L}" y="${H-10}" fill="#94a3b8" font-size="11">${fmtDate(first.date)}</text><text x="${W-R}" y="${H-10}" text-anchor="end" fill="#94a3b8" font-size="11">${fmtDate(last.date)}</text></svg><div class="shark-legend"><span><i class="dot"></i>Lucro acumulado</span><span><i class="zero"></i>Zero</span></div></div>`;
}
function roomSummary(m,selected=''){let arr=m.daily||[];if(selected)arr=arr.filter(x=>x.room===selected);let data={};arr.forEach(x=>{data[x.room]??={invest:0,cash:0,games:0};if(x.type==='buyins'){data[x.room].invest+=x.value;data[x.room].games++;}else if(x.type==='rebuys')data[x.room].invest+=x.value;else if(x.type==='cashes')data[x.room].cash+=x.value;});let keys=Object.keys(data).sort((a,b)=>(data[b].cash-data[b].invest)-(data[a].cash-data[a].invest));if(!keys.length)return '<div class="empty">Nenhum dado por sala.</div>';return `<div class="roomgrid">${keys.map(r=>{let z=data[r],p=z.cash-z.invest,roi=z.invest?p/z.invest*100:0;return `<div class="room"><b>${r}</b><div class="mini"><span>Games</span><span>${z.games}</span></div><div class="mini"><span>Investido</span><span>${money(z.invest)}</span></div><div class="mini"><span>Profit</span><span class="${p>=0?'positive':'negative'}">${money(p)}</span></div><div class="mini"><span>ROI</span><span>${roi.toFixed(1)}%</span></div></div>`}).join('')}</div>`}
function grind(){let m=active();document.getElementById('content').innerHTML=`<div class="panel"><h2>Registrar Grind — ${monthLabel(store.currentMonth)}</h2><div class="form"><div class="field"><label>Data</label><input type="date" id="gdate" value="${store.currentMonth}-01"></div><div class="field"><label>Tipo</label><select id="gtype"><option value="buyins">Buy-in</option><option value="cashes">Cash</option></select></div><div class="field"><label>Sala</label><select id="groom">${rooms.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Valor</label><input id="gvalue" type="number" min="0" step="0.01"></div><div class="field"><label>&nbsp;</label><button class="btn primary" onclick="addGrind()">Adicionar</button></div></div><p class="note">O lançamento fica salvo somente no mês selecionado. Se o mês estiver fechado, reabra-o para editar.</p></div><div class="section panel"><h2>Lançamentos recentes</h2>${grindTable(m.daily.slice().reverse().slice(0,50))}</div>`}
function addGrind(){let m=active();if(m.closed){showToast('Mês fechado. Reabra para editar.');return}let date=document.getElementById('gdate').value;if(monthKey(date)!==store.currentMonth){showToast('Escolha uma data dentro do mês atual');return}let room=document.getElementById('groom').value,type=document.getElementById('gtype').value,value=parseFloat(document.getElementById('gvalue').value);if(!date||!room||Number.isNaN(value)){showToast('Preencha os campos');return}m.daily.push({date,type,room,value,n:1});save();showToast('Lançamento salvo')}
function grindTable(arr){if(!arr.length)return '<div class="empty">Nenhum lançamento.</div>';return `<div class="tablewrap"><table class="table"><tr><th>Data</th><th>Tipo</th><th>Sala</th><th>Valor</th><th></th></tr>${arr.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${x.type==='buyins'?'Buy-in':x.type==='rebuys'?'Rebuy':'Cash'}</td><td>${x.room}</td><td>${money(x.value)}</td><td><button class="btn" onclick="delGrind(${active().daily.indexOf(x)})">Excluir</button></td></tr>`).join('')}</table></div>`}
function delGrind(i){let m=active();if(m.closed){showToast('Mês fechado. Reabra para editar.');return}m.daily.splice(i,1);save()}
function cash(){let m=active();document.getElementById('content').innerHTML=`<div class="panel"><h2>Controle de caixa</h2><div class="form"><div class="field"><label>Data</label><input type="date" id="cdate" value="${store.currentMonth}-01"></div><div class="field"><label>Tipo</label><select id="ctype"><option>INÍCIO</option><option>FIM</option><option>AJUSTES EXTERNOS</option></select></div><div class="field"><label>Sala</label><select id="croom">${cashRooms.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Valor (US$)</label><input id="cvalue" type="number" step="0.01"></div><div class="field"><label>&nbsp;</label><button class="btn primary" onclick="addCash()">Salvar</button></div></div><p class="note">Use FIM para registrar o saldo final por sala. O saldo final do mês será usado como ponto de partida do próximo mês.</p></div><div class="section panel"><h2>Histórico do caixa</h2>${m.cash.length?`<div class="tablewrap"><table class="table"><tr><th>Data</th><th>Tipo</th><th>Valores</th><th></th></tr>${m.cash.map((x,i)=>`<tr><td>${fmtDate(x.date)}</td><td>${x.type}</td><td>${Object.entries(x.vals||{}).map(([k,v])=>k+': '+money(v)).join(' · ')}</td><td><button class="btn" onclick="delCash(${i})">Excluir</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhum registro de caixa.</div>'}</div>`}
function addCash(){let m=active();if(m.closed){showToast('Mês fechado. Reabra para editar.');return}let date=document.getElementById('cdate').value;if(monthKey(date)!==store.currentMonth){showToast('Escolha uma data dentro do mês atual');return}let type=document.getElementById('ctype').value,room=document.getElementById('croom').value,value=parseFloat(document.getElementById('cvalue').value);if(!date||Number.isNaN(value)){showToast('Preencha os campos');return}let row=m.cash.find(x=>x.date===date&&x.type===type);if(!row){row={date,type,vals:{}};m.cash.push(row)}row.vals[room]=value;if(type==='INÍCIO'&&date===store.currentMonth+'-01'&&room==='GG'&&Object.keys(row.vals).length===1)m.openingBankroll=Object.values(row.vals).reduce((a,b)=>a+Number(b),0);save();showToast('Caixa salvo')}
function delCash(i){let m=active();if(m.closed){showToast('Mês fechado. Reabra para editar.');return}m.cash.splice(i,1);save()}
function history(){let m=active(),arr=m.daily.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('content').innerHTML=`<div class="panel"><h2>Histórico — ${monthLabel(store.currentMonth)}</h2><div class="toolbar"><input type="date" id="hfilter" value="${filter}" onchange="filter=this.value;history()"><select onchange="hroom=this.value;history()"><option value="">Todas as salas</option>${rooms.map(r=>`<option ${hroom===r?'selected':''}>${r}</option>`).join('')}</select><button class="btn" onclick="filter='';hroom='';history()">Limpar</button></div>${grindTable(arr.filter(x=>(!filter||x.date===filter)&&(!hroom||x.room===hroom)))}</div>`}
function months(){let ks=Object.keys(store.months).sort().reverse();document.getElementById('content').innerHTML=`<div class="panel"><h2>Histórico de meses</h2><p class="note">Cada mês é independente. Fechar um mês não apaga nada. Ao criar o mês seguinte, o bankroll final anterior é carregado como bankroll inicial.</p><div class="tablewrap"><table class="table"><tr><th>Mês</th><th>Investido</th><th>Retorno</th><th>Resultado</th><th>ROI</th><th>Bankroll final</th><th>Status</th><th></th></tr>${ks.map(k=>{let m=store.months[k],c=calc(m);return `<tr><td>${monthLabel(k)}</td><td>${money(c.invest)}</td><td>${money(c.cash)}</td><td class="${c.result>=0?'positive':'negative'}">${money(c.result)}</td><td>${c.roi.toFixed(2)}%</td><td>${money(endingBankroll(m))}</td><td>${m.closed?'🔒':'🟢'}</td><td><button class="btn" onclick="store.currentMonth='${k}';tab='dash';save()">Abrir</button></td></tr>`}).join('')}</table></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='poker-bankroll-backup-multimes.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.months)store=x;else store={version:2,currentMonth:x.config?.month?.slice(0,7)||'2026-09',months:{[x.config?.month?.slice(0,7)||'2026-09']:{...x,closed:false}}};save();showToast('Backup importado')}catch{showToast('Arquivo inválido')}};r.readAsText(f)}
function showToast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2200)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;filter='';hroom='';render()});render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>


<script>
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredInstallPrompt=e;const b=document.getElementById('installBtn');if(b&&!window.matchMedia('(display-mode: standalone)').matches)b.style.display='inline-block';});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';showToast('Poker Bankroll instalado no Windows');});
async function installPWA(){if(!deferredInstallPrompt){showToast('Use Chrome/Edge em HTTPS ou localhost para instalar');return;}deferredInstallPrompt.prompt();const r=await deferredInstallPrompt.userChoice;if(r.outcome==='accepted'){const b=document.getElementById('installBtn');if(b)b.style.display='none';}deferredInstallPrompt=null;}
</script>
</body></html>
